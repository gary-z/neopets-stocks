<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
<title>Neopets Stock Buyer</title>
<!--
  Served exactly as it sits here - no build step. Prices are read in the browser
  on each visit, and the page forwards to the buy form for the cheapest stock at
  or above the floor below.

  When that can't be done - proxies down, JavaScript off - everything falls back
  to the stock market page itself. That is a worse landing spot but never a
  wrong one, which a hardcoded ticker would eventually become.
-->
<noscript><meta http-equiv="refresh" content="0; url=https://www.neopets.com/stockmarket.phtml"></noscript>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  p { margin: 0; }
  #fallback { opacity: 0.7; }
</style>
</head>
<body>
  <p>Finding the cheapest stock at <span id="floor">15</span> NP or above&hellip;</p>
  <p><a id="fallback" href="https://www.neopets.com/stockmarket.phtml">Go to the stock market</a></p>
<script>
(function () {
  var link = document.getElementById('fallback');
  var minPrice = Number(document.getElementById('floor').textContent) || 15;

  var API = 'https://neostocks.info/api/tickers?period=1d';
  var BUY = 'https://www.neopets.com/stockmarket.phtml?type=buy&ticker=';

  // neostocks serves that JSON without an Access-Control-Allow-Origin header,
  // so a page on another origin can't read it directly. worker/ in this repo is
  // a Cloudflare Worker that re-serves it with CORS headers; deploy it and put
  // its hostname here. Until that is filled in the page runs on the backup
  // proxy alone, the way it did before the worker existed.
  var WORKER = 'https://neopets-stocks-proxy.YOUR-SUBDOMAIN.workers.dev/';

  // A public CORS proxy, kept only for when the worker is unreachable. Public
  // proxies are why this page used to be a coin flip, so this one is asked a
  // beat late rather than in parallel - a healthy worker answers first and the
  // request is never sent.
  var BACKUP = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(API);

  var SOURCES = [];
  if (WORKER.indexOf('YOUR-SUBDOMAIN') === -1) SOURCES.push(WORKER);
  SOURCES.push(BACKUP);

  var BACKUP_DELAY = 1200; // how long a source gets before the next one starts
  var DEADLINE = 4000;     // hard cap, after which we give up and use the link

  var settled = false;
  var started = 0;    // sources whose request has been sent
  var pending = 0;    // of those, the ones still waiting on an answer

  function go(url) {
    if (settled) return;
    settled = true;
    // replace() so the back button returns where the visitor came from rather
    // than bouncing them through here again.
    location.replace(url || link.href);
  }

  // Cheapest at or above the floor, ties broken by ticker so the same market
  // always gives the same answer.
  function cheapest(rows) {
    var best = null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || typeof row.ticker !== 'string' || typeof row.curr !== 'number') continue;
      if (row.curr < minPrice) continue;
      if (!best || row.curr < best.curr || (row.curr === best.curr && row.ticker < best.ticker)) {
        best = row;
      }
    }
    if (!best) throw new Error('nothing trading at ' + minPrice + ' NP or above');
    return best;
  }

  // Sources are started one at a time, either because the one before it took
  // too long or because it failed outright. Both paths land here, and the
  // started index keeps either from sending the same request twice.
  function startNext() {
    if (settled || started >= SOURCES.length) return;
    var url = SOURCES[started++];
    pending++;
    attempt(url);
  }

  // Only the last source still in flight sends the visitor to the fallback
  // link; until then another request may yet come back with an answer.
  function failed() {
    pending--;
    startNext();
    if (pending === 0) go(null);
  }

  function attempt(url) {
    try {
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) { return cheapest(JSON.parse(text)); })
        .then(function (best) { go(BUY + encodeURIComponent(best.ticker)); }, failed);
    } catch (err) {
      failed();
    }
  }

  setTimeout(function () { go(null); }, DEADLINE);

  startNext();
  for (var i = 1; i < SOURCES.length; i++) {
    setTimeout(startNext, BACKUP_DELAY * i);
  }
}());
</script>
</body>
</html>
