<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico">
<title>Neopets Stock Buyer</title>
<!--
  Served exactly as it sits here - no build step. Prices are read in the browser
  on each visit, and the page forwards to the buy form for the cheapest stock at
  or above the floor below.

  When that can't be done - proxies down, JavaScript off - everything falls back
  to the stock market page itself. That is a worse landing spot but never a
  wrong one, which a hardcoded ticker would eventually become.
-->
<noscript><meta http-equiv="refresh" content="0; url=https://www.neopets.com/stockmarket.phtml"></noscript>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  p { margin: 0; }
  #fallback { opacity: 0.7; }
</style>
</head>
<body>
  <p>Finding the cheapest stock at <span id="floor">15</span> NP or above&hellip;</p>
  <p><a id="fallback" href="https://www.neopets.com/stockmarket.phtml">Go to the stock market</a></p>
<script>
(function () {
  var link = document.getElementById('fallback');
  var minPrice = Number(document.getElementById('floor').textContent) || 15;

  var API = 'https://neostocks.info/api/tickers?period=1d';
  var BUY = 'https://www.neopets.com/stockmarket.phtml?type=buy&ticker=';

  // neostocks serves that JSON without an Access-Control-Allow-Origin header,
  // so a page on another origin can't read it directly. These public proxies
  // re-serve it with CORS headers. All three are asked at once and the first
  // usable answer wins - a visitor waiting on a redirect notices a slow proxy
  // far more than these hosts notice one extra request each.
  var PROXIES = [
    function (url) { return 'https://cors.eu.org/' + url; },
    function (url) { return 'https://r.jina.ai/' + url; },
    function (url) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url); }
  ];

  var DEADLINE = 4000;  // hard cap, after which we give up and use the link

  var settled = false;
  var outstanding = 0;

  function go(url) {
    if (settled) return;
    settled = true;
    // replace() so the back button returns where the visitor came from rather
    // than bouncing them through here again.
    location.replace(url || link.href);
  }

  // Proxies disagree about what to wrap the body in - r.jina.ai prepends a
  // header block - so fall back to slicing from the start of the array.
  function parse(text) {
    try {
      return JSON.parse(text);
    } catch (err) {
      var start = text.indexOf('[');
      if (start === -1) throw err;
      return JSON.parse(text.slice(start));
    }
  }

  // Cheapest at or above the floor, ties broken by ticker so the same market
  // always gives the same answer.
  function cheapest(rows) {
    var best = null;
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      if (!row || typeof row.ticker !== 'string' || typeof row.curr !== 'number') continue;
      if (row.curr < minPrice) continue;
      if (!best || row.curr < best.curr || (row.curr === best.curr && row.ticker < best.ticker)) {
        best = row;
      }
    }
    if (!best) throw new Error('nothing trading at ' + minPrice + ' NP or above');
    return best;
  }

  // Only the last proxy to fail sends the visitor to the fallback; until then
  // another request may still come back with an answer.
  function failed() {
    outstanding--;
    if (outstanding === 0) go(null);
  }

  function attempt(proxy) {
    try {
      fetch(proxy(API))
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        })
        .then(function (text) { return cheapest(parse(text)); })
        .then(function (best) { go(BUY + encodeURIComponent(best.ticker)); }, failed);
    } catch (err) {
      failed();
    }
  }

  setTimeout(function () { go(null); }, DEADLINE);

  // Counted up front rather than inside attempt(), so a proxy that fails
  // immediately can't drop the count to zero while others are still unsent.
  outstanding = PROXIES.length;
  for (var i = 0; i < PROXIES.length; i++) attempt(PROXIES[i]);
}());
</script>
</body>
</html>
