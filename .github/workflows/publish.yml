name: Publish site

on:
  schedule:
    # neostocks refreshes every 15 minutes. GitHub delays scheduled runs under
    # load, so treat this as "roughly every 15 minutes", not a guarantee.
    - cron: '*/15 * * * *'
  push:
    branches: [claude/neopets-stock-automation-j3qk50]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a late scheduled run should yield to a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: node scripts/build.js

      # enablement turns Pages on via the API on first run, so the repo doesn't
      # need Settings -> Pages set to "GitHub Actions" by hand first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
