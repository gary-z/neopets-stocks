name: deploy worker

# The page itself is published by GitHub Pages on every push to main. This does
# the same for the worker, so the two halves of the site can't drift apart.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# A deploy that started earlier must not finish later and win.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Deploying is one command, so the only thing standing between a typo and
      # production is this.
      - run: node --test

      - name: wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # Reads the deployed worker the way a visitor's browser would. Catches the
      # failure a green deploy step can still hide: it is up, but answering
      # without the header that makes it usable from the page.
      - name: smoke test the deployed worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "WORKER_URL repository variable is not set - skipping smoke test."
            exit 0
          fi
          headers="$(curl -sS --fail-with-body --max-time 20 -D - -o body.json "$WORKER_URL")"
          echo "$headers"
          echo "$headers" | grep -qi '^access-control-allow-origin: \*' \
            || { echo "::error::deployed worker is missing the CORS header"; exit 1; }
          node -e '
            const rows = JSON.parse(require("fs").readFileSync("body.json", "utf8"));
            if (!Array.isArray(rows) || !rows.length) throw new Error("feed is not a non-empty array");
            if (!rows.some((r) => typeof r.ticker === "string" && typeof r.curr === "number")) {
              throw new Error("no row has the ticker and curr fields the page reads");
            }
            console.log(`feed looks right: ${rows.length} tickers`);
          '
