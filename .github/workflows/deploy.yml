name: Deploy worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer deploy should win outright; there is no state to reconcile.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # Split from deploy so this stays a real signal on branches and forks, where
  # the Cloudflare credentials aren't available.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: neostocks still parses
        run: node scripts/check.js

      # Catches a broken wrangler.toml or an import the Workers runtime can't
      # resolve, without needing an account.
      - name: Worker builds
        run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
